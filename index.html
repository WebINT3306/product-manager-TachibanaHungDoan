<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Sản phẩm</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #f4f4f4; cursor: pointer; }
    tbody tr:hover { background-color: #f1f1f1; }
    tbody tr:nth-child(even) { background-color: #f9f9f9; }
    .form-container { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
    .form-container input { margin-right: 10px; padding: 8px; margin-bottom: 10px; }
    #btn-add { padding: 8px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Thêm sản phẩm</h2>
  <div class="form-container">
    <input type="text" id="input-name" placeholder="Tên sản phẩm">
    <input type="text" id="input-category" placeholder="Danh mục">
    <input type="number" id="input-price" placeholder="Đơn giá">
    <input type="number" id="input-quantity" placeholder="Số lượng">
    <button id="btn-add">Thêm</button>
  </div>

  <h2>Danh sách sản phẩm</h2>
  <table id="product-table">
    <thead>
      <tr>
        <th>STT</th>
        <th id="col-name">Tên sản phẩm <span id="sort-icon"></span></th>
        <th>Danh mục</th>
        <th>Đơn giá</th>
        <th>Số lượng</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    let products = []; 
    let isAscending = true;

    // 4.1 Nạp dữ liệu qua AJAX
    function loadData() {
      const xhr = new XMLHttpRequest();
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          products = JSON.parse(xhr.responseText); // Gán trực tiếp vào biến toàn cục
          renderTable(products);
        }
      };
      xhr.open("GET", "products.json");
      xhr.send();
    }

    // Hàm render dữ liệu ra bảng
    function renderTable(data) {
      const tbody = document.querySelector("#product-table tbody");
      if (!tbody) return;
      tbody.innerHTML = "";
      data.forEach((product, index) => {
        const row = `<tr>
          <td>${index + 1}</td>
          <td>${product.name}</td>
          <td>${product.category}</td>
          <td>${product.price}</td>
          <td>${product.quantity}</td>
        </tr>`;
        tbody.insertAdjacentHTML('beforeend', row);
      });
    }

    // 4.3 Thêm sản phẩm
    document.getElementById("btn-add").addEventListener("click", function() {
      const name = document.getElementById("input-name").value.trim();
      const category = document.getElementById("input-category").value.trim();
      const price = parseFloat(document.getElementById("input-price").value);
      const quantity = parseInt(document.getElementById("input-quantity").value);

      if (name.length >= 3 && price > 0 && quantity >= 1) {
        const newProduct = {
          id: products.length + 1,
          name: name,
          category: category,
          price: price,
          quantity: quantity
        };
        products.push(newProduct);
        renderTable(products);
        
        // Reset form
        document.getElementById("input-name").value = "";
        document.getElementById("input-category").value = "";
        document.getElementById("input-price").value = "";
        document.getElementById("input-quantity").value = "";
      } else {
        alert("Vui lòng nhập đúng định dạng dữ liệu!");
      }
    });

    // 4.2 Sắp xếp
    document.getElementById('col-name').addEventListener('click', function() {
      isAscending = !isAscending;
      products.sort((a, b) => {
        const nameA = a.name.toLowerCase();
        const nameB = b.name.toLowerCase();
        return isAscending ? (nameA < nameB ? -1 : 1) : (nameA > nameB ? -1 : 1);
      });
      document.getElementById('sort-icon').innerText = isAscending ? ' ▲' : ' ▼';
      renderTable(products);
    });

    // SỬA LỖI QUAN TRỌNG: window.onload (viết thường) và đúng tên hàm
    window.onload = loadData; 
  </script>
</body>
</html>
