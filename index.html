<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý Sản phẩm</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f4f4f4; cursor: pointer; }
    tbody tr:nth-child(even) { background-color: #f9f9f9; }
    tbody tr:hover { background-color: #f1f1f1; }
    .form-container { margin-bottom: 20px; border: 1px solid #ddd; padding: 15px; }
    input { margin-right: 10px; padding: 5px; }
    #btn-add { padding: 5px 15px; cursor: pointer; background: #28a745; color: #fff; border: none; }
  </style>
</head>
<body>

  <div class="form-container">
    <input type="text" id="input-name" placeholder="Tên">
    <input type="text" id="input-category" placeholder="Danh mục">
    <input type="number" id="input-price" placeholder="Giá">
    <input type="number" id="input-quantity" placeholder="Số lượng">
    <button id="btn-add">Thêm</button>
  </div>

  <table id="product-table">
    <thead>
      <tr>
        <th>STT</th>
        <th id="col-name">Tên sản phẩm <span id="sort-icon"></span></th>
        <th>Danh mục</th>
        <th>Đơn giá</th>
        <th>Số lượng</th>
      </tr>
    </thead>
    <tbody id="product-list-body"></tbody>
  </table>

  <script>
    // 1. Biến toàn cục quan trọng
    var products = []; 
    var isAscending = true;

    // 2. Hàm Load dữ liệu AJAX
    function loadData() {
      var xhr = new XMLHttpRequest();
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          products = JSON.parse(xhr.responseText);
          renderTable(products);
        }
      };
      xhr.open("GET", "products.json", true);
      xhr.send();
    }

    // 3. Hàm Render bảng (Dùng vòng lặp cơ bản để ổn định nhất)
    function renderTable(data) {
      var tbody = document.querySelector("#product-table tbody");
      if (!tbody) return;
      tbody.innerHTML = "";
      
      for (var i = 0; i < data.length; i++) {
        var p = data[i];
        var row = document.createElement("tr");
        row.innerHTML = "<td>" + (i + 1) + "</td>" +
                        "<td>" + p.name + "</td>" +
                        "<td>" + (p.category || "") + "</td>" +
                        "<td>" + p.price + "</td>" +
                        "<td>" + p.quantity + "</td>";
        tbody.appendChild(row);
      }
    }

    // 4. Chức năng Sắp xếp (Sort)
    document.getElementById("col-name").addEventListener("click", function() {
      isAscending = !isAscending;
      products.sort(function(a, b) {
        var nA = a.name.toLowerCase();
        var nB = b.name.toLowerCase();
        if (isAscending) return nA < nB ? -1 : 1;
        return nA > nB ? -1 : 1;
      });
      document.getElementById("sort-icon").innerHTML = isAscending ? "▲" : "▼";
      renderTable(products);
    });

    // 5. Chức năng Thêm (Add)
    document.getElementById("btn-add").addEventListener("click", function() {
      var nameVal = document.getElementById("input-name").value.trim();
      var catVal = document.getElementById("input-category").value.trim();
      var priceVal = parseFloat(document.getElementById("input-price").value);
      var quantVal = parseInt(document.getElementById("input-quantity").value);

      // Validation theo yêu cầu
      if (nameVal.length >= 3 && !isNaN(priceVal) && priceVal > 0 && !isNaN(quantVal) && quantVal >= 1) {
        var newObj = {
          id: products.length + 1,
          name: nameVal,
          category: catVal,
          price: priceVal,
          quantity: quantVal
        };
        products.push(newObj);
        renderTable(products);

        // Reset inputs
        document.getElementById("input-name").value = "";
        document.getElementById("input-category").value = "";
        document.getElementById("input-price").value = "";
        document.getElementById("input-quantity").value = "";
      }
    });

    // 6. Chạy khi tải trang
    window.onload = loadData;
  </script>
</body>
</html>
